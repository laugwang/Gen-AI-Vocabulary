<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TERM}} · GenAI 詞彙卡</title>
  <meta name="description" content="{{SUMMARY}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-slug="{{SLUG}}">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">GenAI <span>詞彙卡</span></a>
      <nav class="site-nav">
        <a href="../index.html">全部詞彙</a>
        <a href="../about.html">關於 & 新增規則</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <nav class="crumbs"><a href="../index.html">首頁</a> / <span id="cat-badge">分類</span></nav>

    <header class="term-head">
      <h1>{{TERM}}</h1>
      <p class="en">{{EN}}</p>
      <div class="meta">
        <span class="badge">{{LEVEL}}</span>
        <span class="badge level" id="updated"></span>
      </div>
    </header>

    <article class="term">
      <section id="definition">
        <h2>一句話定義</h2>
        <p>{{一句話，≤ 60 字}}</p>
      </section>

      <section id="analogy">
        <h2>白話比喻</h2>
        <p>{{用生活例子比喻，2–4 句}}</p>
      </section>

      <section id="how-it-works">
        <h2>運作原理</h2>
        <ol>
          <li>{{步驟 1}}</li>
          <li>{{步驟 2}}</li>
          <li>{{步驟 3}}</li>
        </ol>
      </section>

      <section id="example">
        <h2>小例子</h2>
        <p>{{一個具體例子}}</p>
        <pre><code>{{程式碼或 prompt（可選）}}</code></pre>
      </section>

      <section id="misconceptions">
        <h2>常見誤解</h2>
        <ul>
          <li><strong>誤解：</strong>{{…}} <strong>其實：</strong>{{…}}</li>
          <li><strong>誤解：</strong>{{…}} <strong>其實：</strong>{{…}}</li>
        </ul>
      </section>

      <section id="related">
        <h2>相關詞彙</h2>
        <ul class="related-list"></ul>
      </section>

      <nav class="pager" id="pager"></nav>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">GenAI 詞彙卡 · 依照 <a href="../about.html">CLAUDE.md</a> 規則由人與 AI 共同維護</div>
  </footer>
  <script src="../assets/term.js"></script>
</body>
</html>
